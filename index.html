<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>YouCam Muse Reel</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#000000; --panel:#0C0C0E; --line:#242428;
    --text:#F6F6F7; --muted:#8C8C93; --hot:#FF3D8A;
    --slide-w: min(calc(100vw - 56px), 400px, calc(64svh * 0.462));
    --ease: cubic-bezier(.32,.72,0,1);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  img{max-width:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:"Figtree", ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column;
    overflow-x:hidden;
  }
  header{
    padding:16px 20px 8px;
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; overflow:hidden; max-height:120px;
    transition:opacity .35s var(--ease), max-height .45s var(--ease), padding .45s var(--ease);
  }
  .howto{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; letter-spacing:.01em; color:var(--muted);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; white-space:nowrap;
  }
  .howto svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .brand{flex:0 0 auto}
  .brand img{display:block; height:26px; width:auto}
  .stage{position:relative; flex:1 1 auto; display:flex; align-items:center; min-height:0}
  .track{
    display:flex; align-items:center; gap:16px; width:100%;
    padding:10px calc((100% - var(--slide-w)) / 2);
    overflow-x:auto; overscroll-behavior-x:contain;
    scroll-snap-type:x mandatory; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .track::-webkit-scrollbar{display:none}
  .slide{
    flex:0 0 var(--slide-w); width:var(--slide-w);
    scroll-snap-align:center;
    border:0; padding:0; background:none; cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  body.js .slide{opacity:.26; transform:scale(.93)}
  body.js .slide.is-active{opacity:1; transform:scale(1)}
  .slide img{
    display:block; width:100%; height:auto;
    aspect-ratio:828/1792; border-radius:22px; background:var(--panel);
    box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 24px 60px -22px rgba(0,0,0,1);
  }
  .slide:focus-visible{outline:none}
  .slide:focus-visible img{outline:2px solid var(--hot); outline-offset:5px}
  .arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:44px; height:44px; display:none; place-items:center;
    border-radius:999px; border:1px solid var(--line);
    background:rgba(12,12,14,.85); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:var(--text); cursor:pointer; transition:background .2s, border-color .2s;
  }
  .arrow:hover{background:#1A1A1E; border-color:#3A3A40}
  .arrow:focus-visible{outline:2px solid var(--hot); outline-offset:3px}
  .arrow[disabled]{opacity:.22; cursor:default}
  .arrow.prev{left:14px}
  .arrow.next{right:14px}
  .arrow svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  @media (hover:hover) and (min-width:760px){ body.js .arrow{display:grid} }
  .rail{
    padding:12px 20px 20px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    overflow:hidden; max-height:180px;
    transition:opacity .35s var(--ease), max-height .45s var(--ease), padding .45s var(--ease);
  }
  .counter{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px; letter-spacing:.12em; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .counter b{color:var(--text); font-weight:500}
  .thumbs{display:flex; gap:8px; max-width:100%; overflow-x:auto; padding:4px; scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .thumb{
    flex:0 0 auto; width:34px; padding:0; border:0; background:none;
    cursor:pointer; border-radius:7px; opacity:.4;
    transition:opacity .3s var(--ease), box-shadow .3s var(--ease);
  }
  .thumb img{display:block;width:100%;height:auto;aspect-ratio:828/1792;border-radius:7px;background:var(--panel)}
  .thumb.is-active{opacity:1; box-shadow:0 0 0 2px var(--hot)}
  .thumb:focus-visible{outline:2px solid var(--hot); outline-offset:3px}
  body.immersive{--slide-w: min(calc(100vw - 20px), calc(92svh * 0.462))}
  body.immersive header, body.immersive .rail{opacity:0; max-height:0; padding-top:0; padding-bottom:0; pointer-events:none}
  body.immersive .slide{cursor:zoom-out}
  body.immersive .slide img{border-radius:16px}
  .hint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    font-size:12px; color:var(--muted);
    background:rgba(0,0,0,.8); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; opacity:0; transition:opacity .4s var(--ease); pointer-events:none;
  }
  body.immersive .hint{opacity:.8}
  @media (max-width:380px){
    .howto{font-size:12px; padding:6px 11px}
    .brand img{height:22px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important; scroll-behavior:auto !important} }
</style>
</head>
<body>
  <header>
    <span class="brand"><img src="img/logo.webp" alt="YouCam Muse"></span>
    <span class="howto">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      左右點選瀏覽
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </span>
  </header>

  <main class="stage">

    <!-- ==========================================================
         排序 = 下面這十行的上下順序。剪下整行、貼到想要的位置即可，
         縮圖列和 01/10 計數會自動跟著變。
         換圖：把新圖放進 img/，檔名一樣（01.webp ~ 10.webp）就會換掉。
         ========================================================== -->
    <div class="track" id="track" tabindex="0" aria-label="Screenshot carousel">
      <button class="slide"><img src="img/01.webp" alt="Screenshot 1"></button>
      <button class="slide"><img src="img/02.webp" alt="Screenshot 2"></button>
      <button class="slide"><img src="img/03.webp" alt="Screenshot 3" loading="lazy"></button>
      <button class="slide"><img src="img/04.webp" alt="Screenshot 4" loading="lazy"></button>
      <button class="slide"><img src="img/05.webp" alt="Screenshot 5" loading="lazy"></button>
      <button class="slide"><img src="img/06.webp" alt="Screenshot 6" loading="lazy"></button>
      <button class="slide"><img src="img/07.webp" alt="Screenshot 7" loading="lazy"></button>
      <button class="slide"><img src="img/08.webp" alt="Screenshot 8" loading="lazy"></button>
      <button class="slide"><img src="img/09.webp" alt="Screenshot 9" loading="lazy"></button>
      <button class="slide"><img src="img/10.webp" alt="Screenshot 10" loading="lazy"></button>
    </div>

    <button class="arrow prev" id="prev" aria-label="上一張"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="arrow next" id="next" aria-label="下一張"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </main>

  <div class="rail">
    <div class="counter" id="counter"></div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="hint">再點一下退出全螢幕</div>

<script>
(function(){
  var body = document.body;
  body.className += ' js';
  var track = document.getElementById('track');
  var thumbs = document.getElementById('thumbs');
  var counter = document.getElementById('counter');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var slides = [].slice.call(track.getElementsByClassName('slide'));
  var N = slides.length;
  var current = -1;
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  /* 縮圖列依照上面 slide 的順序自動產生 */
  var tbtns = slides.map(function(s, i){
    var img = s.getElementsByTagName('img')[0];
    var b = document.createElement('button');
    b.className = 'thumb';
    b.setAttribute('aria-label', '跳到第 ' + (i + 1) + ' 張：' + (img.alt || ''));
    b.setAttribute('title', img.alt || '');
    var ti = document.createElement('img');
    ti.src = img.getAttribute('src');
    ti.alt = '';
    ti.loading = 'lazy';
    b.appendChild(ti);
    thumbs.appendChild(b);
    return b;
  });

  function scrollTo_(el, left, smooth){
    if (el.scrollTo) { try { el.scrollTo({ left: left, behavior: smooth ? 'smooth' : 'auto' }); return; } catch (e) {} }
    el.scrollLeft = left;
  }
  function go(i, smooth){
    i = Math.max(0, Math.min(N - 1, i));
    var s = slides[i];
    scrollTo_(track, s.offsetLeft - (track.clientWidth - s.offsetWidth) / 2, smooth !== false);
  }
  function setActive(i){
    if (i === current) return;
    current = i;
    for (var k = 0; k < N; k++){
      slides[k].className = 'slide' + (k === i ? ' is-active' : '');
      tbtns[k].className = 'thumb' + (k === i ? ' is-active' : '');
    }
    counter.innerHTML = '<b>' + pad(i + 1) + '</b> / ' + N;
    prev.disabled = i === 0;
    next.disabled = i === N - 1;
    var t = tbtns[i];
    scrollTo_(thumbs, t.offsetLeft - (thumbs.clientWidth - t.offsetWidth) / 2, true);
  }
  function nearest(){
    var c = track.scrollLeft + track.clientWidth / 2, best = 0, bd = Infinity;
    for (var k = 0; k < N; k++){
      var d = Math.abs(slides[k].offsetLeft + slides[k].offsetWidth / 2 - c);
      if (d < bd){ bd = d; best = k; }
    }
    return best;
  }
  var ticking = false;
  track.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ setActive(nearest()); ticking = false; });
  });
  prev.onclick = function(){ go(current - 1); };
  next.onclick = function(){ go(current + 1); };
  tbtns.forEach(function(b, i){ b.onclick = function(){ go(i); }; });
  slides.forEach(function(b, i){
    b.onclick = function(){
      if (i !== current){ go(i); return; }
      body.className = /immersive/.test(body.className)
        ? body.className.replace(/ ?immersive/, '')
        : body.className + ' immersive';
      requestAnimationFrame(function(){ go(current, false); });
    };
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ e.preventDefault(); go(current + 1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(current - 1); }
    else if (e.key === 'Escape'){ body.className = body.className.replace(/ ?immersive/, ''); }
  });
  var rz;
  window.addEventListener('resize', function(){
    clearTimeout(rz);
    rz = setTimeout(function(){ go(current, false); }, 120);
  });
  setActive(0);
  go(0, false);
})();
</script>
</body>
</html>
